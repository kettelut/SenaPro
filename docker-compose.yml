version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: senapro-db
    restart: always
    environment:
      POSTGRES_USER: senapro
      POSTGRES_PASSWORD: senapro
      POSTGRES_DB: senapro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senapro -d senapro"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: SenaPro.API/Dockerfile
    container_name: senapro-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=senapro;Username=senapro;Password=senapro
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/gerador/analises || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./sena-pro-frontend
      dockerfile: Dockerfile
    container_name: senapro-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
